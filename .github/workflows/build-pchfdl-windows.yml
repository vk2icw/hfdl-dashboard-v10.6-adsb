name: Build PC-HFDL Windows Test

on:
  push:
    branches:
      - agent/pc-hfdl-launcher-input
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows-build.txt

      - name: Build Windows executables
        shell: powershell
        run: .\BUILD-WINDOWS.ps1

      - name: Test packaged server HTTPS
        shell: powershell
        run: .\smoke_test_packaged_server.ps1

      - name: Prepare Hervé test package
        shell: powershell
        run: |
          $src = ".\dist\HFDL-Dashboard-Windows-v10.6-RC"
          $dst = ".\dist\HFDL-PC-HFDL-Herve-Test"
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dst | Out-Null
          Copy-Item "$src\HFDLDashboard.exe" $dst
          Copy-Item "$src\HFDLDashboardServer.exe" $dst
          @'
          HFDL DASHBOARD - PC-HFDL LIVE TEST

          1. Start PC-HFDL normally with logging enabled.
          2. Run HFDLDashboard.exe.
          3. In PC-HFDL Log Input, enable the input.
          4. Click Browse and select the folder where PC-HFDL writes its .txt log files.
          5. Start the dashboard and PC-HFDL input.
          6. Confirm the input status shows Watching and the message counter increases.
          7. Check aircraft, callsigns/Flight IDs, ICAO addresses, positions and ground station information.

          Please send Louis a screenshot of the launcher, dashboard and PC-HFDL logfile if anything does not work.

          No Python installation is required for this package.
          Experimental hobby software. Not for navigation or flight safety.
          '@ | Set-Content -Path "$dst\HERVE-TEST-INSTRUCTIONS.txt" -Encoding UTF8
          Compress-Archive -Path "$dst\*" -DestinationPath ".\dist\HFDL-PC-HFDL-Herve-Test.zip" -Force

      - name: Upload Hervé test package
        uses: actions/upload-artifact@v4
        with:
          name: HFDL-PC-HFDL-Herve-Test
          path: dist/HFDL-PC-HFDL-Herve-Test.zip
          if-no-files-found: error
